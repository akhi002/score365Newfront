<div class="container mt-4">
  <button class="btn btn-warning mb-3" (click)="refreshList()" [disabled]="loading">
    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
    Refresh WhiteList
  </button>

  <div class="card p-4 mb-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Website Name</label>
        <input
          type="text"
          class="form-control"
          placeholder="Website Name"
          [(ngModel)]="newWebsite.websiteName"
        />
      </div>

      <div class="col-md-6">
        <label class="form-label">Domain</label>
        <input
          type="text"
          class="form-control"
          placeholder="Url"
          [(ngModel)]="newWebsite.domain"
        />
      </div>

      <div class="col-12 text-start">
        <button class="btn btn-primary" (click)="addWebsite()" [disabled]="loading">
          Add Web
        </button>
      </div>
    </div>
  </div>

  <h4 class="fw-bold mb-3">
    Total Whitelisted:- {{ websites.length }}
  </h4>

  <div *ngIf="loading" class="text-center py-3">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <table *ngIf="!loading" class="table table-bordered align-middle">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Website Name</th>
        <th>Domain</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let site of websites; let i = index">
        <td>{{ i + 1 }}</td>
        <td>
          <input type="text" class="form-control" [(ngModel)]="site.websiteName" readonly />
        </td>
        <td>
          <input type="text" class="form-control" [(ngModel)]="site.domain" />
        </td>
        <td>
          <button class="btn btn-warning me-2" (click)="updateWebsite(site)">Update</button>
          <button class="btn btn-danger" (click)="deleteWebsite(site)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="ui-container">
  <h2>All Active Events</h2>

  <!-- SPORT TABS -->
  <div class="tabs">
    <button 
      [class.active]="selectedSport === 'Cricket'"
      (click)="selectSport('Cricket')">
      Cricket
    </button>

    <button 
      [class.active]="selectedSport === 'Soccer'"
      (click)="selectSport('Soccer')">
      Soccer
    </button>

    <button 
      [class.active]="selectedSport === 'Tennis'"
      (click)="selectSport('Tennis')">
      Tennis
    </button>
  </div>

  <h4>{{ selectedSport }}</h4>

  <!-- TABLE -->
  <table class="custom-table">
    <thead>
      <tr>
        <th>#</th>
        <th>MKT ID</th>
        <th>Event Name</th>
        <th>Open Date</th>
        <th>InActive/Active</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let match of groupedMatches[selectedSport]; let i = index">
        <td>{{ i + 1 }}</td>

        <td>
          <div class="market-id">{{ match.marketId }}</div>
          <div class="market-id">{{ match.subMarketId }}</div>
        </td>

        <td>{{ match.eventName }}</td>

        <td>{{ match.openDate | date : 'MM/dd/yyyy hh:mm:ss a' }}</td>

        <td>
          <label class="switch">
            <input
              type="checkbox"
              [checked]="match.isActive"
              (change)="toggleMatchStatus(match)"
            />
            <span class="slider round"></span>
          </label>
        </td>
      </tr>
    </tbody>
  </table>
</div>
